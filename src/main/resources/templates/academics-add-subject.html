<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Add Subject</title></head>
<body>
    <div layout:fragment="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Add New Subject ➕</h1>
            <a href="/academics" style="background: #64748b; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">⬅ Back to Academics</a>
        </div>
        <div class="form-box" style="max-width: 500px; margin: 0 auto; border-top: 5px solid #ffc107;">
            <form action="/addSubject" method="post">
                <label style="font-weight: bold;">Subject Name</label>
                <input type="text" name="subjectName" placeholder="e.g. Mathematics" required>
                <button type="submit" style="background: #ffc107; color: #333; width: 100%; margin-top: 20px; padding: 15px;">Save Subject</button>
            </form>
        </div>
    </div>
</body>
</html>
