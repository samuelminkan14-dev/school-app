<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Transport</title></head>
<body>
    <div layout:fragment="content">
        <h1>Transport Management 🚌</h1>

        <div style="display: flex; gap: 20px; margin-bottom: 30px;">
            <div class="form-box" style="flex: 1; border-top: 5px solid #28a745;">
                <h3>Add New Bus Route</h3>
                <form action="/addRoute" method="post">
                    <input type="text" name="routeName" placeholder="Route Name (e.g. East Legon)" required>
                    <input type="text" name="driverName" placeholder="Driver Name" required>
                    <input type="text" name="vehiclePlate" placeholder="Vehicle Plate (e.g. GT-1234-22)" required>
                    <button type="submit" style="background: #28a745; width: 100%;">Add Route</button>
                </form>
            </div>

            <div class="form-box" style="flex: 1; border-top: 5px solid #fd7e14;">
                <h3>Assign Student to Bus</h3>
                <form action="/assignTransport" method="post">
                    <select name="studentId" required>
                        <option value="">-- Select Student --</option>
                        <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.firstName + ' ' + s.lastName}"></option>
                    </select>
                    <select name="routeId" required>
                        <option value="">-- Select Route --</option>
                        <option th:each="r : ${routes}" th:value="${r.id}" th:text="${r.routeName}"></option>
                    </select>
                    <button type="submit" style="background: #fd7e14; width: 100%;">Assign Student</button>
                </form>
            </div>
        </div>

        <h2>Active Bus Routes & Assignments</h2>
        <table>
            <thead>
                <tr><th>Student Name</th><th>Bus Route</th><th>Driver</th><th>Vehicle Plate</th></tr>
            </thead>
            <tbody>
                <tr th:each="t : ${transports}">
                    <td th:text="${t.student.firstName + ' ' + t.student.lastName}">John Doe</td>
                    <td th:text="${t.busRoute.routeName}">East Legon</td>
                    <td th:text="${t.busRoute.driverName}">Kofi Driver</td>
                    <td th:text="${t.busRoute.vehiclePlate}">GT-1234-22</td>
                </tr>
                <tr th:if="${transports == null || transports.empty}">
                    <td colspan="4" style="text-align: center; padding: 20px;">No students assigned to transport yet.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
