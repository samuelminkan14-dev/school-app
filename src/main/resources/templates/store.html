<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>School Store</title></head>
<body>
    <div layout:fragment="content">
        <h1>School Store & Uniforms 🛍️</h1>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
            <!-- Add Product Form -->
            <div class="form-box" style="border-top: 5px solid #007bff; margin-bottom: 0;">
                <h3>Add New Product</h3>
                <form action="/addProduct" method="post">
                    <input type="text" name="productName" placeholder="Product Name (e.g. School Uniform)" required>
                    <input type="number" step="0.01" name="price" placeholder="Price (GHS)" required>
                    <input type="number" name="stockQuantity" placeholder="Stock Quantity" required>
                    <button type="submit" style="width: 100%;">Add to Inventory</button>
                </form>
            </div>

            <!-- Sell Product Form -->
            <div class="form-box" style="border-top: 5px solid #28a745; margin-bottom: 0;">
                <h3>Sell Product to Student</h3>
                <form action="/sellProduct" method="post">
                    <select name="productId" required>
                        <option value="">-- Select Product --</option>
                        <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.productName + ' (Stock: ' + p.stockQuantity + ')'}"></option>
                    </select>
                    <select name="studentId" required>
                        <option value="">-- Select Student --</option>
                        <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.firstName + ' ' + s.lastName}"></option>
                    </select>
                    <input type="number" name="quantity" placeholder="Quantity" min="1" required>
                    <button type="submit" style="background: #28a745; width: 100%;">Process Sale</button>
                </form>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <!-- Inventory Table -->
            <div>
                <h2>Current Inventory</h2>
                <table>
                    <thead>
                        <tr><th>Product Name</th><th>Price</th><th>Stock</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${products}">
                            <td th:text="${p.productName}">Uniform</td>
                            <td th:text="'GHS ' + ${p.price}">GHS 50</td>
                            <td>
                                <span th:if="${p.stockQuantity > 5}" style="color: #28a745; font-weight: bold;" th:text="${p.stockQuantity}">10</span>
                                <span th:if="${p.stockQuantity <= 5}" style="color: #dc3545; font-weight: bold;" th:text="${p.stockQuantity + ' (Low Stock)'}">3</span>
                            </td>
                        </tr>
                        <tr th:if="${products == null || products.empty}">
                            <td colspan="3" style="text-align: center;">No products in inventory.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Sales History -->
            <div>
                <h2>Recent Sales</h2>
                <table>
                    <thead>
                        <tr><th>Date</th><th>Student</th><th>Item</th><th>Total</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${sales}">
                            <td th:text="${s.saleDate}">2026-11-09</td>
                            <td th:text="${s.student.firstName + ' ' + s.student.lastName}">John Doe</td>
                            <td th:text="${s.product.productName + ' (x' + s.quantity + ')'}">Uniform (x2)</td>
                            <td style="color: #28a745; font-weight: bold;" th:text="'GHS ' + ${s.totalAmount}">GHS 100</td>
                        </tr>
                        <tr th:if="${sales == null || sales.empty}">
                            <td colspan="4" style="text-align: center;">No sales recorded yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
