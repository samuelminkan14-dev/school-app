<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Update Student</title></head>
<body>
    <div layout:fragment="content">
        <h2>Update Student</h2>
        <div class="form-box" style="width: 400px;">
            <form action="/updateStudent" method="post">
                <input type="hidden" name="id" th:value="${student.id}">
                
                <label>First Name:</label>
                <input type="text" name="firstName" th:value="${student.firstName}" required>
                
                <label>Last Name:</label>
                <input type="text" name="lastName" th:value="${student.lastName}" required>
                
                <label>Class (Select or Type):</label>
                <input type="text" name="className" id="classInput" list="class-list" th:value="${student.classroom != null ? student.classroom.className : ''}" placeholder="e.g. Basic 1 or SHS 2" required autocomplete="off">
                <datalist id="class-list">
                    <optgroup label="Primary School">
                        <option value="Basic 1"></option>
                        <option value="Basic 2"></option>
                        <option value="Basic 3"></option>
                        <option value="Basic 4"></option>
                        <option value="Basic 5"></option>
                        <option value="Basic 6"></option>
                    </optgroup>
                    <optgroup label="Junior High School">
                        <option value="JHS 1"></option>
                        <option value="JHS 2"></option>
                        <option value="JHS 3"></option>
                    </optgroup>
                    <optgroup label="Senior High School">
                        <option value="SHS 1"></option>
                        <option value="SHS 2"></option>
                        <option value="SHS 3"></option>
                    </optgroup>
                    <option th:each="c : ${classrooms}" th:value="${c.className}"></option>
                </datalist>
                
                <button type="submit" style="width: 100%; margin-top: 10px;">Update Student</button>
                <a href="/" style="display:block; margin-top:10px; text-align:center; color: #888; text-decoration: none;">Cancel</a>
            </form>
        </div>
    </div>

    <script>
        const classInput = document.getElementById('classInput');
        if(classInput) {
            classInput.addEventListener('blur', function() {
                let val = this.value;
                if(val.length > 0) {
                    if (val.toLowerCase().startsWith('basic')) this.value = 'Basic ' + val.replace(/[^0-9]/g, '');
                    else if (val.toLowerCase().startsWith('jhs')) this.value = 'JHS ' + val.replace(/[^0-9]/g, '');
                    else if (val.toLowerCase().startsWith('shs')) this.value = 'SHS ' + val.replace(/[^0-9]/g, '');
                }
            });
        }
    </script>
</body>
</html>
