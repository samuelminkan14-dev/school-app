<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Enroll Student</title></head>
<body>
    <div layout:fragment="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Enroll New Student ➕</h1>
            <a href="/" style="background: #64748b; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">⬅ Back to List</a>
        </div>

        <form action="/addStudent" method="post" enctype="multipart/form-data" style="max-width: 700px; margin: 0 auto;">
            <div class="form-box" style="border-top: 5px solid #28a745;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <label style="font-weight: bold;">First Name</label>
                        <input type="text" name="firstName" required>
                        <label style="font-weight: bold; margin-top: 10px; display: block;">Last Name</label>
                        <input type="text" name="lastName" required>
                        <label style="font-weight: bold; margin-top: 10px; display: block;">Profile Picture</label>
                        <input type="file" name="profilePic" accept="image/*">
                        <label style="font-weight: bold; margin-top: 10px; display: block;">Class</label>
                        <input type="text" name="className" list="class-list" placeholder="Select or Type" required>
                        <datalist id="class-list">
                            <option th:each="c : ${classrooms}" th:value="${c.className}"></option>
                        </datalist>
                    </div>
                    <div>
                        <label style="font-weight: bold;">Parent Name</label>
                        <input type="text" name="guardianName" required>
                        <label style="font-weight: bold; margin-top: 10px; display: block;">Parent Phone</label>
                        <input type="text" name="guardianPhone" required>
                        <label style="font-weight: bold; margin-top: 10px; display: block;">Location</label>
                        <input type="text" name="guardianLocation" required>
                    </div>
                </div>
                <button type="submit" style="background: #28a745; width: 100%; margin-top: 20px; padding: 15px; font-size: 16px;">Enroll Student</button>
            </div>
        </form>
    </div>
</body>
</html>
