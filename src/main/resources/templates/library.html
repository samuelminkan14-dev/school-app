<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Library</title></head>
<body>
    <div layout:fragment="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Library 📚</h1>
            <a href="/library/add-book" style="background: #3b82f6; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">➕ Add New Book</a>
        </div>
        
        <div class="form-box" style="border-top: 5px solid #f59e0b;">
            <h3>Issue Book to Student</h3>
            <form action="/borrowBook" method="post" style="display: flex; gap: 10px;">
                <select name="bookId" required style="flex: 1;">
                    <option value="">-- Select Book --</option>
                    <option th:each="b : ${books}" th:value="${b.id}" th:text="${b.title}"></option>
                </select>
                <select name="studentId" required style="flex: 1;">
                    <option value="">-- Select Student --</option>
                    <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.firstName + ' ' + s.lastName}"></option>
                </select>
                <button type="submit" style="background: #f59e0b;">Issue Book</button>
            </form>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr><th>Book</th><th>Student</th><th>Borrow Date</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody>
                    <tr th:each="l : ${loans}">
                        <td th:text="${l.book.title}">Book</td>
                        <td th:text="${l.student.firstName + ' ' + l.student.lastName}">Student</td>
                        <td th:text="${l.borrowDate}">Date</td>
                        <td>
                            <span th:if="${l.returnDate == null}" style="color: #dc3545; font-weight: bold;">Borrowed</span>
                            <span th:if="${l.returnDate != null}" style="color: #28a745; font-weight: bold;">Returned</span>
                        </td>
                        <td>
                            <a th:if="${l.returnDate == null}" th:href="@{/returnBook/{id}(id=${l.id})}" class="action-link edit">Mark Returned</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
