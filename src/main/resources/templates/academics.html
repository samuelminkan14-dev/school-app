<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Academics</title></head>
<body>
    <div layout:fragment="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Academic Setup 📚</h1>
            <div style="display: flex; gap: 10px;">
                <a href="/academics/add-class" style="background: #17a2b8; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">➕ Add Class</a>
                <a href="/academics/add-subject" style="background: #ffc107; color: #333; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">➕ Add Subject</a>
            </div>
        </div>

        <div style="display: flex; gap: 20px;">
            <!-- Classes List -->
            <div style="flex: 1;">
                <h2>Classes</h2>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>ID</th><th>Class Name</th></tr></thead>
                        <tbody>
                            <tr th:each="c : ${classes}">
                                <td th:text="${c.id}">1</td>
                                <td th:text="${c.className}">Basic 1</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Subjects List -->
            <div style="flex: 1;">
                <h2>Subjects</h2>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>ID</th><th>Subject Name</th></tr></thead>
                        <tbody>
                            <tr th:each="s : ${subjects}">
                                <td th:text="${s.id}">1</td>
                                <td th:text="${s.subjectName}">Math</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
