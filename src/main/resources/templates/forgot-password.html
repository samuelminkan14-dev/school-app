<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; }
        .box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        a { display: block; margin-top: 15px; font-size: 14px; color: #007bff; text-decoration: none; }
        .error { color: red; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Reset Password 🔑</h2>
        <p style="font-size: 14px; color: #666;">Enter your email to receive a 6-digit OTP code.</p>
        
        <div th:if="${error}" class="error" th:text="${error}"></div>
        
        <form action="/send-otp" method="post">
            <input type="email" name="email" placeholder="Email Address" required>
            <button type="submit">Send OTP</button>
        </form>
        <a href="/login">Back to Login</a>
    </div>
</body>
</html>
