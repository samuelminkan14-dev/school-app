<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Portal</title>
    <style>
        :root { --bg-dark: #0f172a; --bg-darker: #020617; --accent: #3b82f6; --text-light: #94a3b8; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f1f5f9; display: flex; height: 100vh; overflow: hidden; }
        
        .hamburger { position: fixed; top: 15px; left: 15px; font-size: 24px; cursor: pointer; background: var(--bg-dark); color: white; padding: 8px 12px; border-radius: 8px; z-index: 2000; border: none; }
        .top-logout { position: fixed; top: 15px; right: 20px; background: #ef4444; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; z-index: 2000; }

        .sidebar { width: 260px; background-color: var(--bg-dark); color: white; height: 100vh; position: fixed; left: 0; top: 0; transition: 0.3s; z-index: 1000; padding-top: 60px; display: flex; flex-direction: column; }
        .sidebar.closed { left: -260px; }
        .sidebar h2 { text-align: center; padding: 10px 0 20px 0; margin: 0; border-bottom: 1px solid var(--bg-darker); font-size: 18px; }
        .sidebar a { display: block; color: var(--text-light); padding: 15px 20px; text-decoration: none; font-size: 15px; border-left: 3px solid transparent; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.active { background-color: var(--bg-darker); color: white; border-left-color: var(--accent); }

        .main-content { margin-left: 260px; width: calc(100% - 260px); padding: 80px 30px 30px 30px; transition: 0.3s; height: 100vh; overflow-y: auto; }
        .main-content.full-width { margin-left: 0; width: 100%; }

        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background: #f8fafc; font-size: 13px; color: #64748b; text-transform: uppercase; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        @media (max-width: 768px) {
            .sidebar { left: -260px; }
            .sidebar.mobile-open { left: 0; }
            .main-content { margin-left: 0; width: 100%; padding-bottom: 80px; }
        }
        /* --- HOVER EFFECTS --- */
        /* Table Row Hover */
        tbody tr:hover { background-color: #f8fafc; transition: background-color 0.2s; cursor: default; }
        
        /* Card Hover (Lifts up slightly) */
        .card, .form-box { transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover, .form-box:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        
        /* Button Hover */
        button:hover { opacity: 0.9; transform: scale(1.02); transition: 0.2s; }
        
        /* Action Links Hover */
        .action-link { transition: 0.2s; }
        .action-link:hover { text-decoration: underline; opacity: 0.8; }
        
        /* Sidebar Link Hover (Already exists but making it smoother) */
        .sidebar a { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body>
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <a href="/logout" class="top-logout">Logout</a>

    <div class="sidebar" id="sidebar">
        <h2>👨‍👩‍👧 Parent Portal</h2>
        <a href="/parent/dashboard">📊 Overview</a>
        <a href="/parent/exams">📝 Exam Results</a>
        <a href="/parent/payments">💳 Payments & Fees</a>
        <a href="/parent/feedback">💬 Send Feedback</a>
    </div>

    <div class="main-content" id="mainContent">
        <div layout:fragment="content"></div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('mobile-open');
            } else {
                sidebar.classList.toggle('closed');
                mainContent.classList.toggle('full-width');
            }
        }
    </script>
</body>
</html>
