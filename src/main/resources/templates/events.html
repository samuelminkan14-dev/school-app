<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>School Events</title></head>
<body>
    <div layout:fragment="content">
        <h1>School Events Calendar 📅</h1>

        <div class="form-box" style="border-top: 5px solid #8b5cf6;">
            <h3>Create New Event</h3>
            <form action="/addEvent" method="post" style="display: grid; grid-template-columns: 2fr 3fr 1fr 1fr 1fr; gap: 10px;">
                <input type="text" name="title" placeholder="Event Title (e.g. PTA Meeting)" required>
                <input type="text" name="description" placeholder="Description" required>
                <input type="date" name="eventDate" required>
                <input type="text" name="location" placeholder="Location" required>
                <button type="submit" style="background: #8b5cf6;">Add Event</button>
            </form>
        </div>

        <h2>Upcoming Events</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;">
            
            <div th:each="e : ${events}" style="background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #8b5cf6; position: relative;">
                <h3 style="margin-top: 0; color: #333;" th:text="${e.title}">Event Title</h3>
                <p style="color: #64748b; font-size: 14px; margin-bottom: 10px;" th:text="${e.description}">Description goes here</p>
                
                <div style="background: #f8fafc; padding: 10px; border-radius: 5px; font-size: 14px;">
                    <strong>📅 Date:</strong> <span th:text="${e.eventDate}"></span><br>
                    <strong>📍 Location:</strong> <span th:text="${e.location}"></span>
                </div>

                <a th:href="@{/deleteEvent/{id}(id=${e.id})}" style="position: absolute; top: 15px; right: 15px; color: #ef4444; text-decoration: none; font-weight: bold; font-size: 18px;" onclick="return confirm('Delete this event?');">×</a>
            </div>

            <div th:if="${events == null || events.empty}" style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #888; background: white; border-radius: 10px;">
                No upcoming events scheduled.
            </div>
        </div>
    </div>
</body>
</html>
