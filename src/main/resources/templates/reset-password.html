<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Enter OTP</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; }
        .box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .error { color: red; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Enter OTP 📩</h2>
        <p style="font-size: 14px; color: #666;">Check your email for the code.</p>
        
        <div th:if="${error}" class="error" th:text="${error}"></div>
        
        <form action="/reset-password" method="post">
            <input type="hidden" name="email" th:value="${email}">
            <input type="text" name="otp" placeholder="6-Digit OTP" required maxlength="6">
            <input type="password" name="newPassword" placeholder="New Password" required>
            <button type="submit">Reset Password</button>
        </form>
    </div>
</body>
</html>
