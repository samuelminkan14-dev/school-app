<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f1f5f9; margin: 0; }
        .login-box { background: white; padding: 50px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        .form-content { display: none; }
        .form-content.active { display: block; }
        h2 { text-align: center; font-size: 28px; margin-bottom: 30px; color: #1e293b; }
        input[type="text"], input[type="password"], input[type="email"] { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .password-wrapper { position: relative; }
        .eye-icon { position: absolute; right: 15px; top: 25px; cursor: pointer; color: #64748b; font-size: 18px; }
        button { width: 100%; padding: 15px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 15px; }
        button:hover { background: #2563eb; }
        .error { color: #ef4444; font-size: 15px; margin-bottom: 15px; text-align: center; background: #fee2e2; padding: 10px; border-radius: 5px; }
        .success { color: #10b981; font-size: 15px; margin-bottom: 15px; text-align: center; background: #d1fae5; padding: 10px; border-radius: 5px; }
        .forgot-link { display: block; text-align: right; font-size: 14px; color: #3b82f6; text-decoration: none; margin-top: 8px; }
        .strength-meter { height: 6px; width: 100%; background: #e2e8f0; border-radius: 5px; margin-top: 5px; }
        .strength-bar { height: 100%; width: 0%; border-radius: 5px; transition: 0.3s; }
        .strength-text { font-size: 13px; margin-top: 5px; color: #64748b; }
        .switch-link { text-align: center; margin-top: 25px; font-size: 15px; color: #64748b; }
        .switch-link a { color: #3b82f6; text-decoration: none; font-weight: bold; cursor: pointer; }
        .switch-link a:hover { text-decoration: underline; }
        .remember-me { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 15px; }
        .remember-me label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        
        .legal-links { text-align: center; margin-top: 30px; font-size: 12px; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .legal-links a { color: #3b82f6; text-decoration: none; }
        .legal-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>School Portal 🏫</h2>
        
        <div th:if="${param.error}" class="error">Invalid username or password.</div>
        <div th:if="${param.logout}" class="success">You have been logged out.</div>
        <div th:if="${param.success}" class="success">Account created! Please sign in.</div>

        <!-- LOGIN FORM -->
        <div id="login-form" class="form-content active">
            <form th:action="@{/login}" method="post">
                <input type="text" name="username" placeholder="Username" required autofocus>
                <div class="password-wrapper">
                    <input type="password" name="password" id="login-pass" placeholder="Password" required>
                    <span class="eye-icon" onclick="togglePassword('login-pass', this)">👁️</span>
                </div>
                <div class="remember-me">
                    <label><input type="checkbox" name="remember-me" style="width: auto; margin: 0;"> Remember Me</label>
                    <a href="/forgot-password" class="forgot-link">Forgot Password?</a>
                </div>
                <button type="submit">Sign In</button>
            </form>
            <div class="switch-link">
                Don't have an account? <a onclick="switchTab('signup')">Sign Up</a>
            </div>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signup-form" class="form-content">
            <form action="/register" method="post">
                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <div class="password-wrapper">
                    <input type="password" name="password" id="signup-pass" placeholder="Password" onkeyup="checkStrength()" required>
                    <span class="eye-icon" onclick="togglePassword('signup-pass', this)">👁️</span>
                </div>
                <div class="strength-meter"><div id="strength-bar" class="strength-bar"></div></div>
                <div id="strength-text" class="strength-text"></div>
                <div class="password-wrapper">
                    <input type="password" id="confirm-pass" placeholder="Confirm Password" onkeyup="checkMatch()" required>
                    <span class="eye-icon" onclick="togglePassword('confirm-pass', this)">👁️</span>
                </div>
                <div id="match-text" class="strength-text"></div>
                <button type="submit" id="signup-btn" style="background: #10b981;">Create Account</button>
            </form>
            <div class="switch-link">
                Already have an account? <a onclick="switchTab('login')">Sign In</a>
            </div>
        </div>

        <!-- LEGAL LINKS -->
        <div class="legal-links">
            By logging in, you agree to our <br>
            <a href="/terms">Terms of Service</a> &bull; <a href="/privacy">Privacy Policy</a>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
            if(tab === 'login') {
                document.getElementById('login-form').classList.add('active');
            } else {
                document.getElementById('signup-form').classList.add('active');
            }
        }

        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "🙈";
            } else {
                input.type = "password";
                icon.textContent = "👁️";
            }
        }

        function checkStrength() {
            const pass = document.getElementById('signup-pass').value;
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            let strength = 0;

            if (pass.length >= 7) strength += 25;
            if (pass.match(/[a-z]+/)) strength += 25;
            if (pass.match(/[A-Z]+/)) strength += 25;
            if (pass.match(/[0-9]+/) && pass.match(/[^a-zA-Z0-9]+/)) strength += 25;

            bar.style.width = strength + '%';

            if (pass.length === 0) { bar.style.width = '0%'; text.textContent = ''; }
            else if (strength <= 25) { bar.style.background = '#ef4444'; text.textContent = 'Weak (7+ chars, mix letters, numbers, symbols)'; text.style.color = '#ef4444';}
            else if (strength <= 75) { bar.style.background = '#f59e0b'; text.textContent = 'Medium'; text.style.color = '#f59e0b';}
            else { bar.style.background = '#10b981'; text.textContent = 'Strong'; text.style.color = '#10b981';}
        }

        function checkMatch() {
            const pass = document.getElementById('signup-pass').value;
            const confirm = document.getElementById('confirm-pass').value;
            const text = document.getElementById('match-text');
            const btn = document.getElementById('signup-btn');

            if (confirm.length === 0) { text.textContent = ''; return; }

            if (pass === confirm) {
                text.textContent = '✅ Passwords match';
                text.style.color = '#10b981';
                btn.disabled = false;
            } else {
                text.textContent = '❌ Passwords do not match';
                text.style.color = '#ef4444';
                btn.disabled = true;
            }
        }
    </script>
</body>
</html>
