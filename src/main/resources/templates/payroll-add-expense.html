<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Add Expense</title></head>
<body>
    <div layout:fragment="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Record School Expense ➕</h1>
            <a href="/payroll" style="background: #64748b; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">⬅ Back to Payroll</a>
        </div>
        <div class="form-box" style="max-width: 500px; margin: 0 auto; border-top: 5px solid #fd7e14;">
            <form action="/addExpense" method="post">
                <label style="font-weight: bold;">Description</label>
                <input type="text" name="description" placeholder="e.g. Electricity Bill" required>
                <label style="font-weight: bold; margin-top: 10px; display: block;">Amount</label>
                <input type="number" step="0.01" name="amount" required>
                <button type="submit" style="background: #fd7e14; width: 100%; margin-top: 20px; padding: 15px;">Add Expense</button>
            </form>
        </div>
    </div>
</body>
</html>
