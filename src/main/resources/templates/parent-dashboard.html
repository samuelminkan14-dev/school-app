<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout-parent}">
<head><title>Overview</title></head>
<body>
    <div layout:fragment="content">
        
        <!-- WELCOME MESSAGE -->
        <div th:if="${session.welcomeMessage != null}" style="background: #dbeafe; color: #1e40af; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; border-left: 5px solid #3b82f6;">
            <span th:text="${session.welcomeMessage}"></span>
        </div>

        <h1>Welcome, Parent of <span th:text="${student.firstName}"></span>!</h1>
        
        <div th:if="${announcements != null && !announcements.empty}" style="margin: 20px 0;">
            <div th:each="a : ${announcements}" style="background: #fff3cd; border-left: 5px solid #ffc107; padding: 15px; border-radius: 5px; margin-bottom: 10px;">
                <strong style="color: #856404;" th:text="${a.title}"></strong>: <span style="color: #856404;" th:text="${a.message}"></span>
            </div>
        </div>

        <div class="card">
            <h3>✅ Recent Attendance</h3>
            <div class="table-responsive">
                <table>
                    <tr><th>Date</th><th>Status</th></tr>
                    <tr th:each="a : ${attendanceRecords}">
                        <td th:text="${a.date}">2026-11-10</td>
                        <td>
                            <span th:if="${a.status == 'Present'}" style="color: #10b981; font-weight: bold;">Present</span>
                            <span th:if="${a.status == 'Absent'}" style="color: #ef4444; font-weight: bold;">Absent</span>
                            <span th:if="${a.status == 'Late'}" style="color: #f59e0b; font-weight: bold;">Late</span>
                        </td>
                    </tr>
                    <tr th:if="${attendanceRecords == null || attendanceRecords.empty}">
                        <td colspan="2" style="text-align: center; padding: 20px;">No attendance recorded yet.</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
