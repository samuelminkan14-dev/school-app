                <thead>
                    <tr>
                        <th>Staff ID</th> <!-- ADDED THIS -->
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Subject</th>
                        <th>Class</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="teacher : ${teachers}">
                        <td style="font-weight: bold; color: #3b82f6;" th:text="${teacher.staffId}">5052261112</td> <!-- ADDED THIS -->
                        <td th:text="${teacher.firstName}">John</td>
                        <td th:text="${teacher.lastName}">Doe</td>
                        <td th:text="${teacher.subject}">Math</td>
                        <td th:text="${teacher.classroom != null ? teacher.classroom.className : 'N/A'}">Basic 1</td>
                        <td>
                            <a th:href="@{/deleteTeacher/{id}(id=${teacher.id})}" class="action-link delete" onclick="return confirm('Delete this teacher?');">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${teachers == null || teachers.empty}">
                        <td colspan="6" style="text-align: center; padding: 20px;">No teachers added yet.</td>
                    </tr>
                </tbody>
