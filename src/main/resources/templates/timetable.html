<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Timetable</title></head>
<body>
    <div layout:fragment="content">
        <h1>Class Timetable 📅</h1>

        <div class="form-box" style="border-top: 5px solid #8b5cf6; margin-bottom: 30px;">
            <h3>Create Schedule Entry</h3>
            
            <form action="/addTimetable" method="post">
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    
                    <!-- 1. CLASS INPUT -->
                    <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <label style="font-weight: bold; font-size: 14px;">Class (Select or Type New)</label>
                        <input type="text" name="className" list="class-list" placeholder="e.g. Nursery 1 or SHS 2" required autocomplete="off" style="width: 100%;">
                        <datalist id="class-list">
                            <optgroup label="Nursery & Kindergarten">
                                <option value="Nursery 1"></option>
                                <option value="Nursery 2"></option>
                                <option value="KG 1"></option>
                                <option value="KG 2"></option>
                            </optgroup>
                            <optgroup label="Primary School">
                                <option value="Basic 1"></option>
                                <option value="Basic 2"></option>
                                <option value="Basic 3"></option>
                                <option value="Basic 4"></option>
                                <option value="Basic 5"></option>
                                <option value="Basic 6"></option>
                            </optgroup>
                            <optgroup label="Junior High School">
                                <option value="JHS 1"></option>
                                <option value="JHS 2"></option>
                                <option value="JHS 3"></option>
                            </optgroup>
                            <optgroup label="Senior High School">
                                <option value="SHS 1"></option>
                                <option value="SHS 2"></option>
                                <option value="SHS 3"></option>
                            </optgroup>
                            <!-- Load existing classes from database -->
                            <option th:each="c : ${classrooms}" th:value="${c.className}"></option>
                        </datalist>
                    </div>

                    <!-- 2. SUBJECT INPUT (Fixed to allow typing) -->
                    <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <label style="font-weight: bold; font-size: 14px;">Subject (Select or Type New)</label>
                        <input type="text" name="subjectName" list="subject-list" placeholder="e.g. Mathematics or Music" required autocomplete="off" style="width: 100%;">
                        <datalist id="subject-list">
                            <option value="Mathematics"></option>
                            <option value="English Language"></option>
                            <option value="Integrated Science"></option>
                            <option value="Social Studies"></option>
                            <option value="ICT"></option>
                            <option value="Religious & Moral Education"></option>
                            <option value="Ghanaian Language"></option>
                            <option value="Creative Arts"></option>
                            <option value="Physical Education"></option>
                            <option value="French"></option>
                            <option value="Career Technology"></option>
                            <option value="Computing"></option>
                            <!-- Load existing subjects from database -->
                            <option th:each="s : ${subjects}" th:value="${s.subjectName}"></option>
                        </datalist>
                    </div>

                    <!-- 3. TEACHER SELECT -->
                    <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <label style="font-weight: bold; font-size: 14px;">Teacher</label>
                        <select name="teacherId" required style="width: 100%;">
                            <option value="">-- Select Teacher --</option>
                            <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.firstName + ' ' + t.lastName}"></option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
                    
                    <!-- 4. MULTIPLE DAYS -->
                    <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 10px;">Select Days</label>
                        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                            <label style="cursor: pointer;"><input type="checkbox" name="days" value="Monday"> Monday</label>
                            <label style="cursor: pointer;"><input type="checkbox" name="days" value="Tuesday"> Tuesday</label>
                            <label style="cursor: pointer;"><input type="checkbox" name="days" value="Wednesday"> Wednesday</label>
                            <label style="cursor: pointer;"><input type="checkbox" name="days" value="Thursday"> Thursday</label>
                            <label style="cursor: pointer;"><input type="checkbox" name="days" value="Friday"> Friday</label>
                        </div>
                    </div>

                    <!-- 5. TIME -->
                    <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <label style="font-weight: bold; font-size: 14px;">Time Slot</label>
                        <input type="text" name="timeSlot" placeholder="e.g. 08:00 - 09:00" required style="width: 100%;">
                    </div>
                </div>

                <button type="submit" style="background: #8b5cf6; width: 100%; padding: 15px; margin-top: 15px; font-size: 18px;">Add Schedule</button>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Class</th>
                    <th>Subject</th>
                    <th>Teacher</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${timetables}">
                    <td th:text="${t.dayOfWeek}" style="font-weight: bold; color: #8b5cf6;">Monday</td>
                    <td th:text="${t.timeSlot}">08:00</td>
                    <td th:text="${t.classroom.className}">Basic 1</td>
                    <td th:text="${t.subject.subjectName}">Math</td>
                    <td th:text="${t.teacher.firstName + ' ' + t.teacher.lastName}">Mr. John</td>
                    <td>
                        <a th:href="@{/deleteTimetable/{id}(id=${t.id})}" class="action-link delete" onclick="return confirm('Delete this entry?');">Delete</a>
                    </td>
                </tr>
                <tr th:if="${timetables == null || timetables.empty}">
                    <td colspan="6" style="text-align: center; padding: 20px;">No schedule created yet.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
