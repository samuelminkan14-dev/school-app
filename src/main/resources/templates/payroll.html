<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Payroll</title></head>
<body>
    <div layout:fragment="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Staff Payroll & Expenses 💸</h1>
            <div style="display: flex; gap: 10px;">
                <a href="/payroll/add-payslip" style="background: #20c997; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">➕ Generate Payslip</a>
                <a href="/payroll/add-expense" style="background: #fd7e14; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">➕ Add Expense</a>
            </div>
        </div>

        <div style="display: flex; gap: 20px;">
            <!-- Payslip History -->
            <div style="flex: 1;">
                <h2>Payroll History</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr><th>Teacher</th><th>Month</th><th>Net Pay</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${payrolls}">
                                <td th:text="${p.teacher.firstName + ' ' + p.teacher.lastName}">John Doe</td>
                                <td th:text="${p.month}">Nov 2026</td>
                                <td style="color: #28a745; font-weight: bold;" th:text="'GHS ' + ${p.netPay}">GHS 1500</td>
                            </tr>
                            <tr th:if="${payrolls == null || payrolls.empty}">
                                <td colspan="3" style="text-align: center;">No payslips generated.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Expense History -->
            <div style="flex: 1;">
                <h2>Expenses</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr><th>Date</th><th>Description</th><th>Amount</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="e : ${expenses}">
                                <td th:text="${e.expenseDate}">2026-11-09</td>
                                <td th:text="${e.description}">Electricity</td>
                                <td style="color: #dc3545; font-weight: bold;" th:text="'GHS ' + ${e.amount}">GHS 200</td>
                            </tr>
                            <tr th:if="${expenses == null || expenses.empty}">
                                <td colspan="3" style="text-align: center;">No expenses recorded.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
