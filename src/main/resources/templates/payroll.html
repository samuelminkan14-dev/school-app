<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Payroll & Expenses</title></head>
<body>
    <div layout:fragment="content">
        <h1>Staff Payroll & Expenses 💸</h1>

        <!-- Payslip Generation Form -->
        <div class="form-box" style="border-top: 5px solid #20c997;">
            <h3>Generate Teacher Payslip</h3>
            <form action="/generatePayslip" method="post" style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr; gap: 10px;">
                <select name="teacherId" required style="grid-column: span 2;">
                    <option value="">-- Select Teacher --</option>
                    <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.firstName + ' ' + t.lastName}"></option>
                </select>
                <input type="text" name="month" placeholder="Month (e.g. Nov 2026)" required>
                <input type="number" step="0.01" name="basicSalary" placeholder="Basic Salary" required>
                <input type="number" step="0.01" name="allowances" placeholder="Allowances" required>
                <input type="number" step="0.01" name="deductions" placeholder="Deductions" required>
                <button type="submit" style="background: #20c997; grid-column: span 6;">Generate Payslip</button>
            </form>
        </div>

        <!-- Expense Form -->
        <div class="form-box" style="border-top: 5px solid #fd7e14;">
            <h3>Record School Expense</h3>
            <form action="/addExpense" method="post" style="display: grid; grid-template-columns: 3fr 1fr 1fr; gap: 10px;">
                <input type="text" name="description" placeholder="Expense Description (e.g. Electricity Bill)" required>
                <input type="number" step="0.01" name="amount" placeholder="Amount" required>
                <button type="submit" style="background: #fd7e14;">Add Expense</button>
            </form>
        </div>

        <div style="display: flex; gap: 20px;">
            <!-- Payslip Table -->
            <div style="flex: 1;">
                <h2>Payroll History</h2>
                <table>
                    <thead>
                        <tr><th>Teacher</th><th>Month</th><th>Net Pay</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${payrolls}">
                            <td th:text="${p.teacher.firstName + ' ' + p.teacher.lastName}">John Doe</td>
                            <td th:text="${p.month}">Nov 2026</td>
                            <td style="color: #28a745; font-weight: bold;" th:text="'$' + ${p.netPay}">$1500</td>
                        </tr>
                        <tr th:if="${payrolls == null || payrolls.empty}">
                            <td colspan="3" style="text-align: center;">No payslips generated.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Expense Table -->
            <div style="flex: 1;">
                <h2>Expenses</h2>
                <table>
                    <thead>
                        <tr><th>Date</th><th>Description</th><th>Amount</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${expenses}">
                            <td th:text="${e.expenseDate}">2026-11-09</td>
                            <td th:text="${e.description}">Electricity</td>
                            <td style="color: #dc3545; font-weight: bold;" th:text="'$' + ${e.amount}">$200</td>
                        </tr>
                        <tr th:if="${expenses == null || expenses.empty}">
                            <td colspan="3" style="text-align: center;">No expenses recorded.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
