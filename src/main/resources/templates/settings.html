<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>School Settings</title></head>
<body>
    <div layout:fragment="content">
        <h1>School Settings ⚙️</h1>

        <div th:if="${successMessage}" style="background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-bottom: 20px; border-left: 5px solid #28a745;">
            <strong>✅ Success!</strong> <span th:text="${successMessage}"></span>
        </div>

        <div class="form-box" style="border-top: 5px solid #64748b; max-width: 600px;">
            <h3>General Information</h3>
            <form action="/saveSettings" method="post">
                
                <label>School Name</label>
                <input type="text" name="schoolName" th:value="${settings.schoolName}" required>

                <label>Address</label>
                <input type="text" name="address" th:value="${settings.address}">

                <label>Phone Number</label>
                <input type="text" name="phone" th:value="${settings.phone}">

                <label>Email Address</label>
                <input type="email" name="email" th:value="${settings.email}">

                <label>Currency Symbol (e.g. GHS, $, £)</label>
                <input type="text" name="currency" th:value="${settings.currency}" required>

                <button type="submit" style="background: #64748b; width: 100%; margin-top: 15px;">Save Settings</button>
            </form>
        </div>
    </div>
</body>
</html>
