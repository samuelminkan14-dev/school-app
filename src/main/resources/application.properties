spring.application.name=school-app

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# For local testing, it uses H2 file database.
# For production, Render will provide the DATABASE_URL, DB_USERNAME, and DB_PASSWORD
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./schooldb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================================
# EMAIL CONFIGURATION (Gmail SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# FILE UPLOAD LIMITS
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB