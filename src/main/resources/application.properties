spring.application.name=school-app

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# On your own computer it uses the H2 file database.
# On Render it uses Neon, from DB_URL, DB_USER and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./schooldb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Small connection pool, friendly to the free Neon database
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000

# Hibernate Settings (it picks the right dialect by itself)
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# EMAIL CONFIGURATION (Gmail SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# FILE UPLOAD LIMITS
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB